<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="495" height="195" rx="10" fill="url(#grad)" stroke="#30363d" stroke-width="1"/>
  
  <text x="25" y="35" font-family="Verdana, Geneva, sans-serif" font-size="16" font-weight="bold" fill="#58a6ff">Soumyajit Banerjee's GitHub Streak</text>
  
  <!-- Current Streak -->
  <text x="25" y="75" font-family="Verdana, Geneva, sans-serif" font-size="12" fill="#8b949e">Current Streak</text>
  <text x="25" y="95" font-family="Verdana, Geneva, sans-serif" font-size="24" font-weight="bold" fill="#00f964">0 days</text>
  
  <!-- Longest Streak -->
  <text x="250" y="75" font-family="Verdana, Geneva, sans-serif" font-size="12" fill="#8b949e">Longest Streak</text>
  <text x="250" y="95" font-family="Verdana, Geneva, sans-serif" font-size="24" font-weight="bold" fill="#00f964">0 days</text>
  
  <!-- Contribution Count -->
  <text x="25" y="140" font-family="Verdana, Geneva, sans-serif" font-size="12" fill="#8b949e">Total Contributions</text>
  <text x="25" y="160" font-family="Verdana, Geneva, sans-serif" font-size="24" font-weight="bold" fill="#00f964">0</text>
  
  <!-- Note -->
  <text x="25" y="185" font-family="Verdana, Geneva, sans-serif" font-size="10" fill="#8b949e">Contributions from last 365 days</text>
</svg>